appId: com.slyreus.slyorent
productName: Slyorrent
copyright: Copyright © 2026 Slyreus

directories:
  output: release

asar: true
compression: maximum
npmRebuild: false
removePackageScripts: true

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

files:
  - dist/**
  - electron/**
  - public/slyorus.png
  - public/slyorrent-logo.png
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - "!**/*.map"

extraResources:
  - from: public/slyorrent.ico
    to: slyorrent.ico
  - from: .runtime/engine/transmission-4.1.4-openssl-3.5.9-curl-8.23.0/PFiles/Transmission
    to: .runtime/engine/transmission-4.1.3/PFiles/Transmission
    filter:
      - transmission-daemon.exe
      - libcrypto-3-x64.dll
      - libssl-3-x64.dll
      - libcurl.dll
      - z.dll
  - from: .runtime/media/ffmpeg-9.0.2
    to: .runtime/media/ffmpeg-9.0.2
    filter:
      - ffmpeg.exe
      - ffprobe.exe
      - LICENSE.txt
      - README.txt
  - from: LICENSE
    to: licenses/Slyorrent-LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: third_party/transmission-COPYING.txt
    to: licenses/Transmission-COPYING.txt
  - from: .runtime/network/openssl-3.5.9/LICENSE.txt
    to: licenses/OpenSSL-LICENSE.txt
  - from: .runtime/network/openssl-3.5.9/BUILD.json
    to: licenses/OpenSSL-BUILD.json
  - from: .runtime/network/curl-8.23.0/LICENSE.txt
    to: licenses/curl-LICENSE.txt
  - from: .runtime/network/curl-8.23.0/ZLIB-LICENSE.txt
    to: licenses/zlib-LICENSE.txt
  - from: .runtime/network/curl-8.23.0/BUILD.json
    to: licenses/curl-BUILD.json
  - from: .runtime/media/ffmpeg-9.0.2/LICENSE.txt
    to: licenses/FFmpeg-GPL-3.0.txt
  - from: .runtime/media/ffmpeg-9.0.2/README.txt
    to: licenses/FFmpeg-BUILD.txt
  - from: node_modules/geoip-lite/LICENSE
    to: licenses/geoip-lite-and-GeoLite2-LICENSE.txt
  - from: app/components/WORLD_GEOMETRY_LICENSE.md
    to: licenses/WORLD_GEOMETRY_LICENSE.md

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/slyorrent.ico
  requestedExecutionLevel: asInvoker
  artifactName: Slyorrent-Setup-${version}.${ext}

nsis:
  include: build/file-associations.nsh
  installerIcon: public/slyorrent.ico
  uninstallerIcon: public/slyorrent.ico
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Slyorrent
  uninstallDisplayName: Slyorrent
  runAfterFinish: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: Slyreus
  repo: Slyorent
  releaseType: release
