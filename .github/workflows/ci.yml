name: Vérifier Slyorrent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Préparer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer les moteurs vérifiés
        shell: powershell
        run: npm run runtime:install
        env:
          GH_TOKEN: ${{ github.token }}
          SLYORRENT_NETWORK_BOOTSTRAP_RUN: '42413650474'

      - name: Auditer les dépendances
        run: npm audit --audit-level=low

      - name: Évaluer Microsoft Defender sur le runner
        shell: powershell
        run: |
          $usable = $false
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
            $required = @(
              'AMServiceEnabled',
              'AntivirusEnabled',
              'RealTimeProtectionEnabled',
              'BehaviorMonitorEnabled',
              'IoavProtectionEnabled'
            )
            $protectionsEnabled = ($required | Where-Object { $status.$_ -ne $true }).Count -eq 0
            $signatureDate = [DateTime]$status.AntivirusSignatureLastUpdated
            $signatureCurrent = $signatureDate.ToUniversalTime() -ge [DateTime]::UtcNow.AddHours(-72)
            $usable = $protectionsEnabled -and $signatureCurrent
          }
          catch {
            $usable = $false
          }

          if ($usable) {
            Write-Host 'Microsoft Defender est utilisable : le scan réel sera testé.'
          }
          else {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value 'SLYORENT_CI_DEFENDER_UNAVAILABLE=1' -Encoding utf8
            Write-Warning 'Le runner hébergé ne fournit pas un Defender utilisable. La CI vérifiera le refus fermé, sans simuler un scan réel réussi.'
          }

      - name: Vérifier et tester
        run: npm run check

      - name: Empaqueter l'application
        run: npx electron-builder --win dir --x64 --publish never

      - name: Tester la médiathèque et le lecteur
        run: npm run test:catalog-ui && npm run test:media-ui

      - name: Vérifier le contenu du paquet
        run: npm run guard:release

      - name: Tester le lecteur empaqueté
        run: npm run test:packaged-media
